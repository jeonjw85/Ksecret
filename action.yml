name: Ksecret
description: 한국 특화 시크릿/PII 스캐너
author: jeonjw85
branding:
  icon: shield
  color: red
inputs:
  path:
    description: 스캔할 경로
    required: false
    default: "."
  format:
    description: 출력 형식 (console, json, sarif)
    required: false
    default: sarif
  fail:
    description: 이슈가 있으면 잡을 실패로 처리
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.23"
        cache: true
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - name: ksecret 빌드
      shell: bash
      run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/ksecret" "${{ github.action_path }}"
    - name: 스캔
      shell: bash
      run: |
        extra=()
        if [[ "${{ inputs.format }}" == "sarif" ]]; then
          extra+=(--output results.sarif)
        fi
        set +e
        "$RUNNER_TEMP/ksecret" scan "${{ inputs.path }}" --format "${{ inputs.format }}" "${extra[@]}"
        code=$?
        if [[ "${{ inputs.fail }}" != "true" && "$code" -eq 1 ]]; then
          exit 0
        fi
        exit "$code"
