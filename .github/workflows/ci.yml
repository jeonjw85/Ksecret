name: ci
on:
    pull_request:
    push:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.23"
                  cache: true
            - name: test
              run: go test -race -shuffle=on -count=1 ./...
            - name: build
              run: go build -trimpath -ldflags="-s -w" -o bin/ksecret .
